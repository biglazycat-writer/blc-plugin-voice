name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布为 Release 的标签（例如 v0.1.0）；留空只做构建验证'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm

      - name: Resolve version and tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match package.json version 'v$VERSION'"
            exit 1
          fi
          if [ -z "$TAG" ]; then
            echo "::notice::No tag provided; running build validation only."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
      - run: npm run typecheck
      # npm test 依赖构建产物 dist/main.js，必须先 build。
      - run: npm run build
      - run: npm test

      # npm run package 会构建、按 files 组装 package/ 目录、校验结构并生成 sha256。
      - name: Package plugin
        run: npm run package

      - name: Upload validation artifact
        if: steps.meta.outputs.publish == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-package-${{ steps.meta.outputs.version }}
          path: |
            dist-package/*.tgz
            dist-package/*.tgz.sha256

      - name: Create or update GitHub Release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          NOTES="release-notes.md"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" {flag=1; next}
              flag && /^## \[/ {exit}
              flag {print}
            ' CHANGELOG.md > "$NOTES.raw"
          else
            echo "插件包版本 $VERSION。" > "$NOTES.raw"
          fi
          {
            cat "$NOTES.raw"
            echo
            echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/commits/$TAG"
          } > "$NOTES"
          echo "=== release notes ==="
          head -20 "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; updating assets and notes."
            gh release upload "$TAG" dist-package/*.tgz dist-package/*.tgz.sha256 --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            echo "Creating Release $TAG."
            gh release create "$TAG" \
              dist-package/*.tgz dist-package/*.tgz.sha256 \
              --title "v$VERSION" \
              --notes-file "$NOTES"
          fi
          gh release view "$TAG" --json tagName,url,assets
